name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: winetracker_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff format --check src tests migrations
      - run: ruff check src tests migrations
      - run: mypy
      - name: Unit tests (SQLite)
        run: pytest -q
      - name: Integration tests (MySQL 8)
        env:
          WT_TEST_DATABASE_URL: mysql+pymysql://root:ci-root@127.0.0.1:3306/winetracker_test?charset=utf8mb4
        run: pytest -q
      - name: Migrations apply cleanly on MySQL
        env:
          WT_DATABASE_URL: mysql+pymysql://root:ci-root@127.0.0.1:3306/winetracker_test?charset=utf8mb4
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
